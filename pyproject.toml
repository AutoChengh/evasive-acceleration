[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evasive-acceleration"
version = "0.3.0"
description = "Evasive Acceleration for instantaneous traffic-conflict assessment"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Hao Cheng"}]
dependencies = ["numpy>=1.23", "numba>=0.57"]

[project.optional-dependencies]
batch = ["pandas>=1.5"]
viz = ["pandas>=1.5", "matplotlib>=3.6", "Pillow>=9"]
dev = ["pytest>=7", "build>=1"]
notebook = ["pandas>=1.5", "matplotlib>=3.6", "Pillow>=9", "nbformat>=5.7", "nbclient>=0.8", "ipykernel>=6", "ipywidgets>=7.6", "notebook>=6.5"]

[project.scripts]
ea = "evasive_acceleration.cli:main"

[project.urls]
Repository = "https://github.com/AutoChengh/evasive-acceleration"

[tool.setuptools]
# Explicit mapping selects an import hook for editable installs. Its .pth
# stays ASCII even when this checkout is in a Chinese Windows directory.
package-dir = {"" = "src", "evasive_acceleration" = "src/evasive_acceleration"}
py-modules = ["core_ea", "single_frame", "yaw_rate", "batch_compute", "baseline_risk_metrics"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["evasive_acceleration*"]

[tool.setuptools.package-data]
"evasive_acceleration._solver" = ["native_cells.cpp", "ea_sources.json"]

[tool.pytest.ini_options]
# Generated outputs can contain unpacked source distributions and their tests.
# Only collect this checkout's maintained suite by default.
testpaths = ["tests"]
